# DigitalOcean App Platform spec. Deploys straight from GitHub -- no server to
# administer, no pm2, and HTTPS is issued automatically, which matters more than it
# sounds: the questionnaire is an iframe to an https Qualtrics URL, and a browser on an
# http page blocks that as mixed content. The maze would work and the questionnaire
# would silently never appear.
#
# region sgp (Singapore) is the point of the exercise: reachable from mainland China
# without an ICP licence, which is only required to host inside the mainland itself.
#
# Import with:  doctl apps create --spec .do/app.yaml
# or paste it into the App Platform UI. Set the two KV values as SECRETS in the
# dashboard -- never here, this file is committed.
name: llm-maze
region: sgp

services:
  - name: web
    github:
      repo: scriptsherlock/llm-maze-prototype
      branch: v9-mazes-module
      deploy_on_push: true
    environment_slug: node-js
    run_command: npm start
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    # server.js already reads process.env.PORT, so nothing in the app changes.
    health_check:
      http_path: /
    envs:
      # Set both in the dashboard as encrypted secrets, copied from the Vercel project.
      # KV is called server-side, so the store does not move and the data is unaffected.
      - key: KV_REST_API_URL
        scope: RUN_TIME
        type: SECRET
      - key: KV_REST_API_TOKEN
        scope: RUN_TIME
        type: SECRET
